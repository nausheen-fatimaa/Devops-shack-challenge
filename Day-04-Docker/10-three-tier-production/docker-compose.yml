services:

  frontend:

    build:
      context: ./frontend

    container_name: frontend

    restart: unless-stopped

    networks:
      - frontend-network


  backend:

    build:
      context: ./backend

    container_name: backend

    restart: unless-stopped

    environment:

      DB_HOST: ${DB_HOST}

      DB_USER: ${DB_USER}

      DB_PASSWORD: ${DB_PASSWORD}

      DB_NAME: ${DB_NAME}

    depends_on:

      mysql:

        condition: service_healthy

    networks:

      - frontend-network

      - backend-network


  mysql:

    image: mysql:8.4

    container_name: mysql

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      MYSQL_DATABASE: ${MYSQL_DATABASE}

      MYSQL_USER: ${MYSQL_USER}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:

      - mysql-data:/var/lib/mysql

      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]

      interval: 10s

      timeout: 5s

      retries: 5

    networks:

      - backend-network


  nginx:

    build:
      context: ./nginx

    container_name: nginx

    restart: unless-stopped

    ports:

      - "80:80"

    depends_on:

      - frontend

      - backend

    networks:

      - frontend-network

      - backend-network


networks:

  frontend-network:

    driver: bridge


  backend-network:

    driver: bridge


volumes:

  mysql-data: