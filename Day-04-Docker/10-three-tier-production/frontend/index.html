<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DevOps Three-Tier Application</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            text-align: center;
            padding-top: 80px;
        }

        .container {
            background: white;
            width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            background: #eef3f8;
            border-radius: 8px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🚀 Production Three-Tier Application</h1>

        <p>
            Frontend served using Docker and NGINX
        </p>

        <div class="status">

            <h3>Backend Status</h3>

            <p id="backend-status">
                Checking backend...
            </p>

        </div>

        <div class="status">

            <h3>Database Status</h3>

            <p id="database-status">
                Checking database...
            </p>

        </div>

    </div>


    <script>

        async function checkBackend() {

            try {

                const response = await fetch("/api/health");

                const data = await response.json();

                document.getElementById(
                    "backend-status"
                ).innerText = data.status;

            }

            catch (error) {

                document.getElementById(
                    "backend-status"
                ).innerText = "Backend Unavailable";

            }

        }


        async function checkDatabase() {

            try {

                const response = await fetch("/api/database");

                const data = await response.json();

                document.getElementById(
                    "database-status"
                ).innerText = data.database;

            }

            catch (error) {

                document.getElementById(
                    "database-status"
                ).innerText = "Database Unavailable";

            }

        }


        checkBackend();

        checkDatabase();

    </script>

</body>

</html>
