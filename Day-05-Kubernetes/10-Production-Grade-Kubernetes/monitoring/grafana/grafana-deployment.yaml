apiVersion: apps/v1
kind: Deployment

metadata:
  name: production-grafana
  namespace: production-demo

spec:

  replicas: 1

  selector:

    matchLabels:
      app: production-grafana

  template:

    metadata:

      labels:
        app: production-grafana

    spec:

      containers:

        - name: grafana

          image: grafana/grafana:latest

          ports:

            - containerPort: 3000

          env:

            - name: GF_SECURITY_ADMIN_USER
              value: admin

            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin123