{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: production-ingress
  namespace: production-demo

spec:

  ingressClassName: {{ .Values.ingress.className }}

  rules:

    - host: {{ .Values.ingress.host }}

      http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: frontend-service

                port:

                  number: 80

{{- end }}